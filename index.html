<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>ARSLAN AI</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      min-height:100vh;
      background:
        radial-gradient(circle at 20% 10%,#7c3aed55,transparent 30%),
        radial-gradient(circle at 90% 80%,#00e5ff44,transparent 30%),
        linear-gradient(135deg,#050510,#07152b);
      color:white;
      font-family:Arial,sans-serif;
    }

    .app{
      width:100%;
      max-width:700px;
      margin:auto;
      padding:25px 16px 40px;
    }

    .header{
      text-align:center;
      padding:25px 10px;
    }

    .logo{
      font-size:32px;
      font-weight:900;
      background:linear-gradient(
        90deg,#00e5ff,#7c3aed,#ff00cc,#ffd000
      );
      -webkit-background-clip:text;
      color:transparent;
    }

    .subtitle{
      color:#aaa;
      margin-top:8px;
    }

    .box{
      margin-top:20px;
      padding:22px;
      border-radius:24px;
      background:#ffffff0d;
      border:1px solid #ffffff20;
      backdrop-filter:blur(20px);
      box-shadow:0 20px 60px #0008;
    }

    .box h2{
      margin-bottom:15px;
      font-size:21px;
    }

    .input-box{
      display:flex;
      gap:10px;
      padding:7px;
      border-radius:15px;
      background:#0005;
    }

    input{
      flex:1;
      min-width:0;
      padding:15px;
      border:0;
      outline:0;
      border-radius:10px;
      background:#ffffff12;
      color:white;
      font-size:15px;
    }

    input::placeholder{
      color:#888;
    }

    button{
      border:0;
      border-radius:11px;
      padding:0 18px;
      color:white;
      font-weight:bold;
      cursor:pointer;
    }

    .get{
      background:linear-gradient(
        135deg,#00c6ff,#7c3aed
      );
    }

    .preview{
      display:none;
      margin-top:20px;
    }

    .thumb{
      width:100%;
      border-radius:18px;
      display:block;
    }

    .title{
      margin-top:15px;
      font-size:18px;
      font-weight:bold;
    }

    .options{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin-top:15px;
    }

    select{
      width:100%;
      padding:14px;
      border:1px solid #ffffff20;
      border-radius:12px;
      background:#101326;
      color:white;
      outline:none;
    }

    .download{
      width:100%;
      margin-top:18px;
      padding:16px;
      font-size:16px;
      background:linear-gradient(
        90deg,#ff00cc,#7c3aed,#00c6ff
      );
      box-shadow:0 10px 30px #7c3aed55;
    }

    .status{
      text-align:center;
      margin-top:15px;
      color:#00e5ff;
      min-height:20px;
    }

    .notice{
      margin-top:20px;
      padding:16px;
      border-radius:15px;
      background:#ffd00010;
      border:1px solid #ffd00030;
      color:#ccc;
      font-size:13px;
      line-height:1.6;
    }

    footer{
      text-align:center;
      color:#666;
      margin-top:30px;
      font-size:12px;
    }

    @media(max-width:600px){

      .logo{
        font-size:27px;
      }

      .input-box{
        flex-direction:column;
      }

      .get{
        padding:15px;
      }

      .options{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="logo">⚡ ARSLAN AI</div>
    <div class="subtitle">
      Fast • Simple • High Quality
    </div>
  </header>


  <div class="box">

    <h2>🔗 Video Link</h2>

    <div class="input-box">

      <input
        id="url"
        type="url"
        placeholder="Paste your video link..."
      >

      <button class="get" onclick="getVideo()">
        GET
      </button>

    </div>

    <div id="status" class="status"></div>

  </div>


  <div id="preview" class="box preview">

    <img
      id="thumbnail"
      class="thumb"
      src=""
      alt="Video"
    >

    <div id="title" class="title">
      Video Preview
    </div>


    <div class="options">

      <select id="format">
        <option value="mp4">🎬 MP4 Video</option>
        <option value="mp3">🎵 MP3 Audio</option>
      </select>

      <select id="quality">
        <option value="1080">🔥 1080p Full HD</option>
        <option value="720">✨ 720p HD</option>
        <option value="480">480p</option>
        <option value="360">360p</option>
      </select>

    </div>


    <button
      class="download"
      onclick="downloadVideo()">
      ⬇️ DOWNLOAD
    </button>

  </div>


  <div class="notice">
    ⚠️ केवल अपने या अनुमति प्राप्त content को
    download करें। Platform restrictions को bypass
    नहीं किया जाता।
  </div>


  <footer>
    © 2026 ARSLAN AI
  </footer>

</div>


<script>

function getVideo(){

  const url =
    document.getElementById("url").value.trim();

  const status =
    document.getElementById("status");

  if(!url){
    status.innerText =
      "⚠️ पहले video link डालें";
    return;
  }

  status.innerText =
    "⏳ Video information प्राप्त हो रही है...";

  /*
    यहां आपका backend/API connect होगा।
    YouTube restrictions bypass करने वाला
    extractor यहां नहीं लगाया गया है।
  */

  setTimeout(() => {

    document.getElementById("preview")
      .style.display = "block";

    document.getElementById("title")
      .innerText = "Video Ready";

    status.innerText =
      "✅ Link received";

  },800);
}


function downloadVideo(){

  const format =
    document.getElementById("format").value;

  const quality =
    document.getElementById("quality").value;

  document.getElementById("status")
    .innerText =
    "⏳ " + format.toUpperCase() +
    " " + quality + "p download तैयार हो रहा है...";

  /*
    यहां authorized media file का
    direct download endpoint connect करें।
  */

}

</script>

</body>
</html>
